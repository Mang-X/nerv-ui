name: ci

on:
  pull_request:
  push:
    branches: [main]

# 同一分支的新推送取消旧任务：这条线上一次推送就可能动几百个文件，
# 没必要让两次全量工作区跑叠在一起。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # `@nerv-ui/ui` 自己的部分测试按包名自引用（`from '@nerv-ui/ui/…'`），
      # `vue-tsc` 解析到的是 `exports` 指向的 `dist/*.d.ts`——`dist` 不入库，
      # 所以类型检查前必须先构建一次，否则会报 TS2307「找不到模块」。
      - name: 构建被类型检查与测试自引用消费的包
        run: pnpm --filter @nerv-ui/ui --filter @nerv-ui/ui-mobile build

      # 全部包都是 workspace 私有包，`vue-tsc` 走 tsconfig 源码解析，不需要先 build。
      - name: 类型检查（10 个工作区项目）
        run: pnpm typecheck

      # `vp lint` 目前只有 warning，退出码 0，可以当硬门禁。
      - name: Lint
        run: pnpm lint

      # 不加 `continue-on-error` 的话这里一进来就是红的：基线有 262 个文件
      # 本来就不合规（不是这次改动引入的）。等这批清干净后删掉
      # `continue-on-error`，它就自动变成硬门禁。
      - name: 格式检查（基线未清，暂不阻断）
        continue-on-error: true
        run: pnpm fmt

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # playground 的 setup 与契约壳经包边界（`@nerv-ui/ui` 的 `exports`）消费库，
      # 解析目标是 `dist/`，而 `dist/` 不入库。不先构建，这些用例会以
      # 「无法解析模块」判红，而不是因为断言失败——红得没有信息量。
      - name: 构建被测试消费的 shadcn 包
        run: pnpm --filter @nerv-ui/ui --filter @nerv-ui/ui-mobile build

      - name: 全工作区测试
        run: pnpm test

  build:
    name: 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 顺序是刻意的：`sync-theme.mjs` 把 tokens 镜像进四个组件包，
      # docs-next 再经包边界消费它们的 `dist/`。
      - name: 构建主题与四个组件包
        run: |
          pnpm --filter @nerv-ui-next/theme \
               --filter @nerv-ui-next/desktop \
               --filter @nerv-ui-next/mobile \
               --filter @nerv-ui-next/pad \
               --filter @nerv-ui-next/screen build

      - name: 构建 shadcn 库
        run: pnpm --filter @nerv-ui/ui --filter @nerv-ui/ui-mobile build

      - name: 构建 docs-next
        run: pnpm --filter @nerv-ui/docs-next build

      - name: 构建 docs
        run: pnpm --filter @nerv-iip/docs build

      - name: 构建 playground
        run: pnpm --filter @nerv-iip/playground build

  agent-bridge:
    name: 代理桥体检
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 docs-next 依赖
        run: |
          pnpm --filter @nerv-ui-next/theme \
               --filter @nerv-ui-next/desktop \
               --filter @nerv-ui-next/mobile \
               --filter @nerv-ui-next/pad \
               --filter @nerv-ui-next/screen build

      - name: 构建 docs-next
        run: pnpm --filter @nerv-ui/docs-next build

      # 体检脚本只依赖 Chrome 的 DevTools 协议与 Node 自带 WebSocket，
      # 不装 Playwright。runner 上 Chrome 已预装，这里只是把路径指给它。
      - name: 定位 Chrome
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -z "$CHROME" ]; then
            echo "::error::找不到 Google Chrome，代理桥体检无法执行"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: 起预览服务并跑四分区体检
        run: |
          cd apps/docs-next
          (npx vitepress preview . --host 127.0.0.1 --port 5280 > /tmp/preview.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5280/desktop/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5280/desktop/ || {
            echo "::error::预览服务没起来"; cat /tmp/preview.log; exit 1
          }
          for section in desktop mobile pad screen; do
            echo "=== $section ==="
            node scripts/agent-audit.mjs --section "$section"
          done
